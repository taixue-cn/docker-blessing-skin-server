name: Taixue OIDC plugin

on:
  push:
    branches: [master]
    paths:
      - "plugins/taixue-oidc/**"
      - ".github/workflows/taixue-oidc.yaml"
  pull_request:
    paths:
      - "plugins/taixue-oidc/**"
      - ".github/workflows/taixue-oidc.yaml"

permissions:
  contents: read

concurrency:
  group: taixue-oidc-production
  cancel-in-progress: false

jobs:
  security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: plugins/taixue-oidc
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Audit dependencies
        working-directory: plugins/taixue-oidc
        run: composer audit --locked --no-dev
      - name: Lint plugin
        working-directory: plugins/taixue-oidc
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run OIDC security checks
        working-directory: plugins/taixue-oidc
        run: php tests/security.php
      - name: Package the tested plugin
        if: github.event_name == 'push'
        run: tar -czf taixue-oidc.tar.gz -C plugins/taixue-oidc .
      - name: Preserve the tested deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: taixue-oidc-${{ github.sha }}
          path: taixue-oidc.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    if: github.event_name == 'push'
    needs: security-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the tested plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: taixue-oidc-${{ github.sha }}
          path: .deployment
      - name: Load the production deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust the production host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Transfer the tested plugin artifact
        run: |
          scp -P "${{ secrets.SSH_PORT }}" \
            .deployment/taixue-oidc.tar.gz \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/taixue-oidc-${{ github.sha }}.tar.gz"
      - name: Deploy the tested plugin to the production bind mount
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 10m
          script: |
            set -eu

            case "$DEPLOY_SHA" in
              *[!0-9a-f]*|'') echo 'Invalid deployment SHA' >&2; exit 1 ;;
            esac
            [ "${#DEPLOY_SHA}" -eq 40 ] || { echo 'Invalid deployment SHA length' >&2; exit 1; }

            SERVICE_ROOT=/home/taixue/data/services/blessing-skin-server
            COMPOSE_FILE=/home/taixue/data/services/docker-compose.yml
            CONTAINER=taixue.blessing-skin-server
            LIVE=/var/www/html/plugins/taixue-oidc
            STAGE="/var/www/html/plugins/.taixue-oidc-stage-$DEPLOY_SHA"
            PREVIOUS="/var/www/html/plugins/.taixue-oidc-previous-$DEPLOY_SHA"
            BACKUP="$SERVICE_ROOT/backups/taixue-oidc-pre-$DEPLOY_SHA"
            ARCHIVE="/tmp/taixue-oidc-$DEPLOY_SHA.tar.gz"
            HOST_STAGE=$(mktemp -d "/tmp/taixue-oidc-$DEPLOY_SHA-XXXXXX")
            SWAPPED=0

            rollback() {
              exit_code=$?
              trap - EXIT INT TERM
              rm -rf -- "$HOST_STAGE"
              rm -f -- "$ARCHIVE"
              if [ "$SWAPPED" -eq 1 ]; then
                echo 'Deployment failed; restoring the previous plugin' >&2
                docker exec "$CONTAINER" php artisan plugin:disable taixue-oidc >/dev/null 2>&1 || true
                docker exec -u 0 "$CONTAINER" sh -c \
                  'rm -rf -- "$1"; if [ -d "$2" ]; then mv -- "$2" "$1"; fi' \
                  sh "$LIVE" "$PREVIOUS"
                docker exec "$CONTAINER" php artisan plugin:enable taixue-oidc >/dev/null 2>&1 || true
                docker compose -f "$COMPOSE_FILE" restart blessing-skin-server >/dev/null 2>&1 || true
              else
                docker exec -u 0 "$CONTAINER" rm -rf -- "$STAGE" >/dev/null 2>&1 || true
              fi
              exit "$exit_code"
            }
            trap rollback EXIT INT TERM

            [ -s "$ARCHIVE" ] || { echo 'Tested deployment artifact is missing' >&2; exit 1; }
            tar -xzf "$ARCHIVE" -C "$HOST_STAGE"
            [ -s "$HOST_STAGE/bootstrap.php" ] || { echo 'Deployment artifact is invalid' >&2; exit 1; }

            mkdir -p "$SERVICE_ROOT/backups"
            if [ ! -e "$BACKUP" ]; then
              docker cp "$CONTAINER:$LIVE" "$BACKUP"
            fi

            docker exec -u 0 "$CONTAINER" rm -rf -- "$STAGE" "$PREVIOUS"
            docker exec -u 0 "$CONTAINER" mkdir -p "$STAGE"
            docker cp "$HOST_STAGE/." "$CONTAINER:$STAGE/"
            if docker exec "$CONTAINER" test -f "$LIVE/.env"; then
              docker exec -u 0 "$CONTAINER" cp -p "$LIVE/.env" "$STAGE/.env"
            fi
            docker exec -u 0 "$CONTAINER" chown -R nobody:nogroup "$STAGE"
            docker exec "$CONTAINER" test -s "$STAGE/vendor/autoload.php"
            docker exec -u nobody -w "$STAGE" "$CONTAINER" php tests/security.php

            docker exec "$CONTAINER" php artisan plugin:disable taixue-oidc
            docker exec -u 0 "$CONTAINER" sh -c \
              'mv -- "$1" "$2"; mv -- "$3" "$1"' \
              sh "$LIVE" "$PREVIOUS" "$STAGE"
            SWAPPED=1
            docker exec "$CONTAINER" php artisan plugin:enable taixue-oidc
            docker compose -f "$COMPOSE_FILE" restart blessing-skin-server

            attempts=0
            until curl --fail --silent --show-error --output /dev/null \
              https://skin.taixue.cc/auth/login; do
              attempts=$((attempts + 1))
              [ "$attempts" -lt 20 ] || { echo 'Login smoke test timed out' >&2; exit 1; }
              sleep 2
            done
            smoke_headers="$HOST_STAGE/login-headers"
            smoke_body="$HOST_STAGE/login-body"
            response_location() {
              awk 'tolower($1) == "location:" {
                $1=""; sub(/^ /, ""); sub(/\r$/, ""); print
              }' "$1" | tail -n 1
            }
            assert_unified_login_redirect() {
              location=$(response_location "$1")
              case "$location" in
                /auth/taixue|https://skin.taixue.cc/auth/taixue) ;;
                *) echo "Unexpected unified-login redirect: $location" >&2; exit 1 ;;
              esac
            }
            assert_recovery_redirect() {
              location=$(response_location "$1")
              case "$location" in
                https://auth.taixue.cc/recover*) ;;
                *) echo "Unexpected recovery redirect: $location" >&2; exit 1 ;;
              esac
            }

            login_status=$(curl --silent --show-error \
              --dump-header "$smoke_headers" --output "$smoke_body" \
              --write-out '%{http_code}' https://skin.taixue.cc/auth/login)
            case "$login_status" in
              200)
                grep -F 'data-taixue-recovery' "$smoke_body"
                grep -F 'href="https://auth.taixue.cc/recover"' "$smoke_body"
                ;;
              302) assert_unified_login_redirect "$smoke_headers" ;;
              *) echo "Unexpected login status: $login_status" >&2; exit 1 ;;
            esac

            local_status=$(curl --silent --show-error \
              --dump-header "$smoke_headers" --output "$smoke_body" \
              --write-out '%{http_code}' 'https://skin.taixue.cc/auth/login?local=1')
            case "$local_status" in
              200)
                grep -F 'data-taixue-recovery' "$smoke_body"
                grep -F 'href="https://auth.taixue.cc/recover"' "$smoke_body"
                ;;
              302) assert_unified_login_redirect "$smoke_headers" ;;
              *) echo "Unexpected local-recovery status: $local_status" >&2; exit 1 ;;
            esac

            forgot_status=$(curl --silent --show-error \
              --dump-header "$smoke_headers" --output "$smoke_body" \
              --write-out '%{http_code}' https://skin.taixue.cc/auth/forgot)
            case "$forgot_status" in
              200) ;;
              302) assert_recovery_redirect "$smoke_headers" ;;
              *) echo "Unexpected recovery status: $forgot_status" >&2; exit 1 ;;
            esac
            [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              https://skin.taixue.cc/auth/taixue/ready)" = 204 ]

            expected_bootstrap=$(sha256sum "$HOST_STAGE/bootstrap.php" | cut -d ' ' -f 1)
            deployed_bootstrap=$(docker exec "$CONTAINER" sha256sum "$LIVE/bootstrap.php" | cut -d ' ' -f 1)
            [ "$expected_bootstrap" = "$deployed_bootstrap" ]

            SWAPPED=0
            docker exec -u 0 "$CONTAINER" rm -rf -- "$PREVIOUS"
            rm -rf -- "$HOST_STAGE"
            rm -f -- "$ARCHIVE"
            trap - EXIT INT TERM
            echo "Taixue OIDC $DEPLOY_SHA deployed successfully"
